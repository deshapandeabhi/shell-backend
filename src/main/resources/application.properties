spring.application.name=ShellMRPL

# Basic DB config for H2 embedded database
spring.datasource.url=jdbc:h2:mem:shellmrpl_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging, standard /h2-console path)
spring.h2.console.enabled=true

# Security secret for AES encryption (32 chars for AES-256)
app.security.pii-encryption-key=VAPT_Secure_Key_Must_Be_32Bytes!
