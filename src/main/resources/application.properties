spring.application.name=ShellMRPL

# Database Configuration
# This will use MySQL if environment variables are present, otherwise fallback to H2
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:shellmrpl_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MYSQLUSER:sa}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driverClassName=${MYSQL_DRIVER:org.h2.Driver}

# JPA and Hibernate configuration
spring.jpa.database-platform=${MYSQL_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging, standard /h2-console path)
spring.h2.console.enabled=true

# Security secret for AES encryption (32 chars for AES-256)
app.security.pii-encryption-key=${APP_SECURITY_PII_ENCRYPTION_KEY:VAPT_Secure_Key_Must_Be_32Bytes!}
