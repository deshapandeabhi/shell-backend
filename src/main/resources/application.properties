spring.application.name=ShellMRPL

# Database Configuration
# We build the JDBC URL manually because Railway's MYSQL_URL doesn't include the 'jdbc:' prefix
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:shellmrpl_db}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 fallback for local dev if MySQL variables are missing (Optional)
# If you want to run locally with H2, you would change the above to use fallbacks.

# Security secret for AES encryption (32 chars for AES-256)
app.security.pii-encryption-key=${APP_SECURITY_PII_ENCRYPTION_KEY:VAPT_Secure_Key_Must_Be_32Bytes!}
