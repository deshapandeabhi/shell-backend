# ─────────────────────────────────────────────────────────────
# application-production.properties
# Activated by: SPRING_PROFILES_ACTIVE=production
# All values are read from Docker environment variables
# ─────────────────────────────────────────────────────────────

spring.application.name=ShellMRPL

# ── Database (wired from docker-compose.yml env vars) ────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# CRITICAL: Use 'validate' in production — never 'update' or 'create'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── H2 Console: DISABLED in production (VAPT) ────────────────
spring.h2.console.enabled=false

# ── Swagger / OpenAPI: DISABLED in production (VAPT) ─────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Actuator: restrict endpoints (VAPT) ──────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# ── Mail (SMTP) ───────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Security ──────────────────────────────────────────────────
app.security.pii-encryption-key=${APP_SECURITY_PII_ENCRYPTION_KEY}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiry-ms=${JWT_EXPIRY_MS:900000}

# ── AWS S3 (for secure document storage) ─────────────────────
aws.s3.bucket=${AWS_S3_BUCKET}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-1}

# ── Logging: reduce verbosity in production ───────────────────
logging.level.root=WARN
logging.level.com.example.backend_spring=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n
